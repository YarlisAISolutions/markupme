# Dependabot: security fixes and weekly version bumps. Actions are pinned to commit SHAs;
# Dependabot keeps the SHA and its `# vN` comment current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
    commit-message: { prefix: "chore(deps)" }

  - package-ecosystem: bun
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Node 24.22.1 is the runtime pin (CLAUDE.md rule 9); its types follow it.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message: { prefix: "chore(deps)" }
