# Dependency vulnerability scan with OSV-Scanner (public reusable workflows).
# The org suite in YarlisAISolutions/bastion can't be used here: bastion is private
# and GitHub does not let a public repository call a private repository's reusable
# workflow. Secret scanning runs in ci.yml (gitleaks). Switch back to the bastion
# suite when it is published for public repositories.
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 6 * * 1" # Mondays 06:41 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  osv-scan:
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      fail-on-vuln: false

  osv-scan-pr:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      fail-on-vuln: false
