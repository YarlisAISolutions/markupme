name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: lint
        run: bun run lint:check
      - name: build
        run: bun run build
      - name: type-check
        run: bun run type-check
      - name: test
        run: bun run test
      - name: examples validate with --strict
        run: node packages/cli/dist/bin.js validate examples --strict --check-diagrams
      - name: rendering is deterministic
        run: |
          for run in a b; do
            node packages/cli/dist/bin.js render examples -o "out/$run/pages" --standalone -q
            node packages/cli/dist/bin.js render examples/kitchen-sink.md -f ast -o "out/$run/kitchen-sink.json" -q
            node packages/cli/dist/bin.js build examples -o "out/$run/site"
          done
          diff -r out/a out/b
      - name: package the VS Code extension
        run: cd packages/vscode && bun run package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: markupme-vscode-vsix
          path: packages/vscode/*.vsix
          retention-days: 14
      - name: pack (what npm would publish)
        run: |
          for p in core highlight diagrams themes react cli; do
            (cd "packages/$p" && npm pack --dry-run 2>&1 | tail -6)
          done

  # End-to-end: the SDODS suites in YarlisAISolutions/markupme-qa against this build.
  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: YarlisAISolutions/markupme-qa
          # Repository variable QA_REF tests against a markupme-qa branch (bootstrap, paired PRs).
          ref: ${{ vars.QA_REF || 'main' }}
          path: qa
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: build markupme
        run: bun install --frozen-lockfile && bun run build
      - name: start markupme serve
        run: |
          node packages/cli/dist/bin.js build examples -o examples/site
          nohup node packages/cli/dist/bin.js serve examples --port 4321 --no-live-reload > serve.log 2>&1 &
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:4321/api/health && exit 0; sleep 1; done
          cat serve.log; exit 1
      - name: install SDODS
        working-directory: qa
        run: bun install --frozen-lockfile && npx playwright install --with-deps chromium
      - name: sdods lint
        working-directory: qa
        run: npx sdods lint -p markupme --strict
      - name: sdods api
        working-directory: qa
        run: npx sdods run -p markupme -e local -l api --workers 2 && node scripts/qa-gate.mjs --suite api --min-scenarios 15
      - name: sdods ui
        working-directory: qa
        run: npx sdods run -p markupme -e local -l ui -b chromium --workers 2 && node scripts/qa-gate.mjs --suite ui --min-scenarios 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: sdods-evidence
          path: qa/.sdods/runs
          retention-days: 14

  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          case "$(uname -m)" in x86_64) arch=x64 ;; aarch64|arm64) arch=arm64 ;; *) echo "::error::unsupported arch $(uname -m)"; exit 1 ;; esac
          tgz="gitleaks_${GITLEAKS_VERSION}_linux_${arch}.tar.gz"
          curl -sSfLO "$base/$tgz"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " $tgz\$" | sha256sum -c -
          tar xzf "$tgz" gitleaks
          ./gitleaks git --redact -v -c .gitleaks.toml .
